kind = "web"
previewPath = "/"
title = "ExDetox"
version = "1.0.0"
id = "artifacts/exdetox"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19318

[services.development]
run = "pnpm --filter @workspace/exdetox run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/exdetox", "run", "build" ]
publicDir = "artifacts/exdetox/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19318"
BASE_PATH = "/"
