<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0b14"/>
      <stop offset="100%" stop-color="#13101f"/>
    </linearGradient>
    <linearGradient id="glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%" id="radial">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="radialGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Glow blob -->
  <ellipse cx="600" cy="280" rx="380" ry="260" fill="url(#radialGlow)" filter="url(#blur)"/>

  <!-- Border frame -->
  <rect x="1" y="1" width="1198" height="628" rx="0" fill="none" stroke="#8b5cf620" stroke-width="2"/>

  <!-- Top badge -->
  <rect x="466" y="120" width="268" height="36" rx="18" fill="#8b5cf615" stroke="#8b5cf630" stroke-width="1"/>
  <text x="600" y="144" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="middle" letter-spacing="2">BREAKUP RECOVERY TRACKER</text>

  <!-- Main headline -->
  <text x="600" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="96" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="-2">ExDetox</text>

  <!-- Tagline -->
  <text x="600" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#94a3b8" text-anchor="middle">Stop checking their Instagram.</text>
  <text x="600" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#94a3b8" text-anchor="middle">Start healing for real.</text>

  <!-- Level pills -->
  <g transform="translate(165, 415)">
    <!-- Broken -->
    <rect x="0" y="0" width="110" height="38" rx="19" fill="#ef444415" stroke="#ef444430"/>
    <text x="55" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f87171" text-anchor="middle">Broken</text>
    <!-- Recovering -->
    <rect x="126" y="0" width="130" height="38" rx="19" fill="#f9731615" stroke="#f9731630"/>
    <text x="191" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fb923c" text-anchor="middle">Recovering</text>
    <!-- Detaching -->
    <rect x="272" y="0" width="120" height="38" rx="19" fill="#eab30815" stroke="#eab30830"/>
    <text x="332" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">Detaching</text>
    <!-- Detached -->
    <rect x="408" y="0" width="115" height="38" rx="19" fill="#22c55e15" stroke="#22c55e30"/>
    <text x="465" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#4ade80" text-anchor="middle">Detached</text>
    <!-- Reborn -->
    <rect x="539" y="0" width="100" height="38" rx="19" fill="#14b8a615" stroke="#14b8a630"/>
    <text x="589" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#2dd4bf" text-anchor="middle">Reborn</text>
    <!-- Unreachable -->
    <rect x="655" y="0" width="145" height="38" rx="19" fill="#8b5cf640" stroke="#8b5cf680" filter=""/>
    <text x="727" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#c4b5fd" text-anchor="middle">Unreachable ✦</text>
  </g>

  <!-- Bottom tagline -->
  <text x="600" y="550" font-family="system-ui, sans-serif" font-size="18" fill="#475569" text-anchor="middle">Free to start · No account needed · Your data stays private</text>
</svg>
